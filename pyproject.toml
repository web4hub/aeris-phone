[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-phone"
version = "0.2.0"
description = "AERIS spatial-computing phone software stack"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "opencv-python>=4.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
